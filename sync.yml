name: Sync Garmin to Sheets

on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC = 23:30 (verano) / 22:30 (invierno) en Murcia
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_garmin_to_sheets.py
        env:
          SHEET_ID: 1PkYiE36qOD90s1mUkJDOhkDyontjP__FLq6AxuXhBNA
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          DAYS_BACK: "3"
